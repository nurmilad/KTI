<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Baca — Jurnal NBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f8fc; --surface:#fff; --ink:#0f172a; --ink-soft:#475569; --ink-mute:#94a3b8;
  --line:#e2e8f0; --brand:#0d6e5c; --brand-2:#14b8a6; --brand-soft:#ecfdf5;
  --accent:#f59e0b; --radius:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 10px 25px -12px rgba(15,23,42,.15);
  --shadow-lg:0 24px 48px -20px rgba(13,110,92,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.85); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1140px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.back-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:10px;
  background:var(--brand-soft); color:var(--brand);
  font-size:13px; font-weight:600; text-decoration:none;
  transition:.15s;
}
.back-btn:hover{ background:#d1fae5; transform:translateX(-2px); }
.back-btn svg{ width:14px; height:14px; }
.topbar-actions{ display:flex; gap:8px; align-items:center; }
.btn-icon{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:10px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); font-size:13px; font-weight:600;
  cursor:pointer; transition:.15s; text-decoration:none; font-family:inherit;
}
.btn-icon:hover{ background:var(--bg); border-color:var(--ink-mute); color:var(--ink); }
.btn-icon svg{ width:14px; height:14px; }

/* ============ HERO / MASTHEAD ============ */
.masthead{
  background:
    radial-gradient(900px 300px at 10% -10%,rgba(20,184,166,.3),transparent 60%),
    linear-gradient(135deg,#062b24 0%,#0d6e5c 60%,#0f766e 100%);
  color:#fff; padding:48px 24px 88px; position:relative; overflow:hidden;
}
.masthead::after{
  content:""; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);
  pointer-events:none;
}
.masthead-inner{ max-width:900px; margin:0 auto; position:relative; z-index:1; }
.masthead .eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
  padding:6px 14px; border-radius:999px; font-size:11.5px;
  font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:#99f6e4; backdrop-filter:blur(8px);
}
.masthead .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:#4ade80; }
.masthead h1{
  font-family:'Lora',serif; font-weight:600;
  font-size:clamp(26px,4vw,40px); line-height:1.2;
  letter-spacing:-.02em; margin:20px 0 16px;
}
.masthead .authors{
  font-size:15px; color:rgba(255,255,255,.85); line-height:1.7;
}
.masthead .authors .role{
  font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:#99f6e4; margin-right:6px;
}
.masthead .authors .sep{ color:rgba(255,255,255,.35); margin:0 10px; }

/* ============ CONTENT ============ */
.container{
  max-width:820px; margin:-56px auto 0;
  padding:0 24px 80px; position:relative; z-index:2;
}

/* Abstrak box */
.abstract-box{
  background:#fff; border-radius:var(--radius); padding:28px 32px;
  box-shadow:var(--shadow-md); border:1px solid var(--line);
  border-left:4px solid var(--brand-2);
  margin-bottom:24px;
}
.abstract-box h2{
  font-size:11px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; color:var(--brand); margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.abstract-box h2::before{
  content:""; width:20px; height:2px; background:var(--brand-2); border-radius:2px;
}
.abstract-box p{
  font-family:'Lora',serif; font-style:italic;
  font-size:16px; line-height:1.75; color:var(--ink-soft);
}

/* Meta info */
.meta-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 24px; margin-bottom:24px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:20px;
}
.meta-item .label{
  font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-mute); margin-bottom:4px;
}
.meta-item .value{
  font-size:14.5px; font-weight:600; color:var(--ink);
}

/* Table of contents */
.toc{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 24px; margin-bottom:28px;
}
.toc h3{
  font-size:11px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-mute); margin-bottom:12px;
}
.toc ol{ list-style:none; counter-reset:toc; }
.toc li{ counter-increment:toc; padding:6px 0; }
.toc li a{
  color:var(--ink-soft); text-decoration:none; font-size:14px;
  display:flex; align-items:center; gap:10px;
  padding:6px 10px; border-radius:8px; transition:.15s;
}
.toc li a::before{
  content:counter(toc) ".";
  font-weight:700; color:var(--brand); min-width:20px;
}
.toc li a:hover{ background:var(--brand-soft); color:var(--brand); }

/* Article sections */
.article{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:32px 40px; margin-bottom:20px; box-shadow:var(--shadow-sm);
}
.section-title{
  font-family:'Lora',serif; font-weight:600;
  font-size:22px; letter-spacing:-.01em; color:var(--ink);
  margin-bottom:20px; padding-bottom:14px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px;
  scroll-margin-top:90px;
}
.section-title .num{
  font-size:12px; font-weight:800; color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; flex-shrink:0;
  letter-spacing:0;
}
.section-title.no-num .num{ display:none; }

/* Content from rich text editor */
.content{
  font-size:15.5px; line-height:1.8; color:#1e293b;
  word-wrap:break-word;
}
.content p{ margin:12px 0; }
.content h1{
  font-family:'Lora',serif; font-size:24px; font-weight:600;
  margin:20px 0 10px; color:var(--ink);
}
.content h2{
  font-family:'Lora',serif; font-size:20px; font-weight:600;
  margin:18px 0 8px; color:var(--ink);
}
.content h3{ font-size:17px; font-weight:700; margin:14px 0 6px; color:var(--ink); }
.content ul, .content ol{ padding-left:24px; margin:12px 0; }
.content li{ margin:4px 0; }
.content a{ color:var(--brand-2); text-decoration:underline; }
.content blockquote{
  border-left:3px solid var(--brand-2); padding:4px 16px;
  margin:14px 0; color:var(--ink-soft); font-style:italic;
  background:#f8fafc; border-radius:0 8px 8px 0;
}
.content img{ max-width:100%; height:auto; border-radius:8px; margin:12px 0; }
.content strong{ font-weight:700; color:var(--ink); }

/* Empty section */
.empty-note{
  padding:20px; text-align:center; color:var(--ink-mute); font-size:13.5px;
  background:#f8fafc; border-radius:10px; font-style:italic;
}

/* ============ STATES ============ */
.page-state{
  max-width:600px; margin:80px auto; padding:48px 32px; text-align:center;
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-md);
}
.page-state .icon{
  width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
  display:grid; place-items:center; font-size:28px;
  background:var(--brand-soft); color:var(--brand);
}
.page-state.error .icon{ background:#fee2e2; color:#dc2626; }
.page-state h2{
  font-family:'Lora',serif; font-size:22px; font-weight:600;
  margin-bottom:8px;
}
.page-state p{ color:var(--ink-soft); font-size:14.5px; margin-bottom:20px; }

/* Loading spinner */
.loader{
  width:40px; height:40px; margin:0 auto 16px;
  border:3px solid var(--line); border-top-color:var(--brand-2);
  border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin{ to{transform:rotate(360deg)} }

/* Footer */
footer{
  text-align:center; padding:32px 24px;
  color:var(--ink-mute); font-size:13px;
  border-top:1px solid var(--line); background:var(--surface);
}
footer strong{ color:var(--ink-soft); }

/* ============ RESPONSIVE ============ */
@media (max-width:640px){
  .masthead{ padding:36px 20px 76px; }
  .container{ padding:0 16px 60px; }
  .article{ padding:24px 22px; }
  .abstract-box{ padding:22px 22px; }
  .section-title{ font-size:19px; }
  .topbar-inner{ padding:12px 16px; }
  .btn-icon .label{ display:none; }
  .btn-icon{ padding:8px 10px; }
}

/* ============ PRINT ============ */
@media print{
  .topbar, footer, .back-btn, .btn-icon, .toc { display:none !important; }
  body{ background:#fff; }
  .masthead{ background:#fff !important; color:#000; padding:20px 0; }
  .masthead::after{ display:none; }
  .masthead h1{ color:#000; }
  .masthead .authors{ color:#333; }
  .masthead .eyebrow{ background:#f0f0f0; color:#333; border-color:#ccc; }
  .masthead .authors .role{ color:#666; }
  .container{ margin:0; padding:0; max-width:100%; }
  .article, .abstract-box, .meta-card{
    box-shadow:none; border:none; padding:0; margin-bottom:16px;
    page-break-inside:avoid;
  }
  .section-title{ page-break-after:avoid; }
  .abstract-box{ border-left:3px solid #000; padding-left:16px; }
}
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Kembali
    </a>
    <div class="topbar-actions">
      <button class="btn-icon" onclick="window.print()" title="Cetak / Simpan PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        <span class="label">Cetak</span>
      </button>
      <button class="btn-icon" id="copyLinkBtn" title="Salin tautan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <span class="label">Salin Link</span>
      </button>
    </div>
  </div>
</div>

<!-- ============ MAIN ============ -->
<main id="main">
  <div class="page-state">
    <div class="loader"></div>
    <h2>Memuat karya…</h2>
    <p>Mohon tunggu sebentar</p>
  </div>
</main>

<footer>
  © <span id="year"></span> <strong>Jurnal Penelitian Ilmiah NBS</strong> · Nurmilad Boarding School
</footer>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrM9btMLwDeXcCQlpZvGcb5cdD9j3hbew",
  authDomain: "kti-nbs.firebaseapp.com",
  projectId: "kti-nbs",
  storageBucket: "kti-nbs.firebasestorage.app",
  messagingSenderId: "431375211363",
  appId: "1:431375211363:web:155551508e145bb26b9156"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ================= UTIL ================= */
function escapeHtml(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
document.getElementById('year').textContent = new Date().getFullYear();

function renderState(type, title, desc, actionHtml = '') {
  const icons = { error:'⚠️', empty:'📄' };
  document.getElementById('main').innerHTML = `
    <div class="page-state ${type}">
      <div class="icon">${icons[type] || '📄'}</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(desc)}</p>
      ${actionHtml}
    </div>
  `;
}

/* ================= AMBIL ID DARI URL ================= */
const params = new URLSearchParams(location.search);
const id = params.get('id');

if (!id) {
  renderState('error', 'ID Karya Tidak Ditemukan',
    'URL tidak menyertakan parameter ?id=... Silakan kembali ke beranda dan pilih karya.',
    '<a href="index.html" class="btn-icon" style="background:var(--brand);color:#fff;border:none;padding:10px 20px;">← Kembali ke Beranda</a>');
} else {
  loadJournal(id);
}

/* ================= LOAD DATA ================= */
async function loadJournal(docId) {
  try {
    const snap = await getDoc(doc(db, 'journals', docId));
    if (!snap.exists()) {
      renderState('error', 'Karya Tidak Ditemukan',
        'Dokumen yang Anda cari tidak ada atau sudah dihapus.',
        '<a href="index.html" class="btn-icon" style="background:var(--brand);color:#fff;border:none;padding:10px 20px;">← Kembali ke Beranda</a>');
      return;
    }
    renderJournal({ id: snap.id, ...snap.data() });
  } catch (err) {
    console.error(err);
    renderState('error', 'Gagal Memuat Karya',
      (err.code || '') + ' — ' + err.message,
      '<a href="index.html" class="btn-icon" style="background:var(--brand);color:#fff;border:none;padding:10px 20px;">← Kembali ke Beranda</a>');
  }
}

/* ================= RENDER ================= */
function renderJournal(j) {
  // Authors
  const authors = Array.isArray(j.authors) && j.authors.length
    ? j.authors
    : (j.author ? [j.author] : ['Anonim']);

  const authorsHtml = authors.map((a, i) => {
    const role = i === 0 ? 'Ketua' : (i === 1 ? 'Anggota' : 'Anggota');
    const sep  = i < authors.length - 1 ? '<span class="sep">·</span>' : '';
    return `<span><span class="role">${role}</span>${escapeHtml(a)}</span>${sep}`;
  }).join(' ');

  // Chapters
  const chapters = j.chapters || {};
  const chapterLabels = [
    { key: '1', title: 'Bab 1 — Pendahuluan' },
    { key: '2', title: 'Bab 2 — Tinjauan Pustaka' },
    { key: '3', title: 'Bab 3 — Metodologi' },
    { key: '4', title: 'Bab 4 — Hasil & Pembahasan' },
    { key: '5', title: 'Bab 5 — Kesimpulan' }
  ];

  // Cek konten yang ada untuk TOC
  const availableToc = [];
  if (j.preface && j.preface.trim()) availableToc.push({ id: 'sec-preface', title: 'Kata Pengantar' });
  chapterLabels.forEach(c => {
    if (chapters[c.key] && chapters[c.key].trim()) {
      availableToc.push({ id: `sec-bab${c.key}`, title: c.title });
    }
  });
  if (j.references && j.references.trim()) availableToc.push({ id: 'sec-ref', title: 'Daftar Pustaka' });

  const tocHtml = availableToc.length
    ? `
      <div class="toc">
        <h3>Daftar Isi</h3>
        <ol>
          ${availableToc.map(t => `<li><a href="#${t.id}">${escapeHtml(t.title)}</a></li>`).join('')}
        </ol>
      </div>
    ` : '';

  // Sections
  const sections = [];

  // Kata Pengantar
  if (j.preface && j.preface.trim()) {
    sections.push(`
      <section class="article">
        <h2 class="section-title no-num" id="sec-preface">
          <span class="num">i</span>Kata Pengantar
        </h2>
        <div class="content">${j.preface}</div>
      </section>
    `);
  }

  // Bab 1-5
  chapterLabels.forEach((c, idx) => {
    const content = chapters[c.key];
    if (content && content.trim()) {
      sections.push(`
        <section class="article">
          <h2 class="section-title" id="sec-bab${c.key}">
            <span class="num">${c.key}</span>${escapeHtml(c.title)}
          </h2>
          <div class="content">${content}</div>
        </section>
      `);
    }
  });

  // Daftar Pustaka
  if (j.references && j.references.trim()) {
    sections.push(`
      <section class="article">
        <h2 class="section-title no-num" id="sec-ref">
          <span class="num">r</span>Daftar Pustaka
        </h2>
        <div class="content">${j.references}</div>
      </section>
    `);
  }

  const noContent = sections.length === 0;

  // Render halaman
  document.getElementById('main').innerHTML = `
    <!-- MASTHEAD -->
    <header class="masthead">
      <div class="masthead-inner">
        <div class="eyebrow">
          <span class="dot"></span>
          ${escapeHtml(j.category || 'Umum')} · ${escapeHtml(String(j.year || '-'))}
        </div>
        <h1>${escapeHtml(j.title || 'Tanpa Judul')}</h1>
        <div class="authors">${authorsHtml}</div>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="container">

      <!-- ABSTRAK -->
      <div class="abstract-box">
        <h2>Abstrak</h2>
        <p>${escapeHtml(j.abstract || 'Tidak ada abstrak.')}</p>
      </div>

      <!-- META -->
      <div class="meta-card">
        <div class="meta-item">
          <div class="label">Bidang</div>
          <div class="value">${escapeHtml(j.category || 'Umum')}</div>
        </div>
        <div class="meta-item">
          <div class="label">Tahun</div>
          <div class="value">${escapeHtml(String(j.year || '-'))}</div>
        </div>
        <div class="meta-item">
          <div class="label">Jumlah Penulis</div>
          <div class="value">${authors.length} orang</div>
        </div>
        <div class="meta-item">
          <div class="label">Diterbitkan</div>
          <div class="value">${formatDate(j.createdAt)}</div>
        </div>
      </div>

      <!-- TOC -->
      ${tocHtml}

      <!-- SECTIONS -->
      ${noContent ? '<div class="article"><div class="empty-note">Karya ini belum memiliki isi bab atau kata pengantar.</div></div>' : sections.join('')}

    </div>
  `;

  // Scroll ke atas setelah render
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ================= FORMAT DATE ================= */
function formatDate(ts) {
  if (!ts) return '-';
  try {
    // Firestore Timestamp
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleDateString('id-ID', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
  } catch {
    return '-';
  }
}

/* ================= COPY LINK ================= */
document.getElementById('copyLinkBtn')?.addEventListener('click', async function() {
  try {
    await navigator.clipboard.writeText(location.href);
    const label = this.querySelector('.label');
    const original = label.textContent;
    label.textContent = '✓ Tersalin';
    this.style.background = 'var(--brand-soft)';
    this.style.color = 'var(--brand)';
    this.style.borderColor = 'var(--brand-2)';
    setTimeout(() => {
      label.textContent = original;
      this.style.background = '';
      this.style.color = '';
      this.style.borderColor = '';
    }, 1800);
  } catch (err) {
    alert('Gagal menyalin tautan: ' + err.message);
  }
});
</script>
</body>
</html>
